<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="850" height="279" viewBox="0 0 850 279" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif"><defs><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0064FF"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#686A72"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44464E"/></marker></defs><rect width="850" height="279" fill="#FFFFFF"/><text x="16.0" y="36.0" font-size="14.0" font-weight="700" fill="#131417" text-anchor="start">국내 Pleos 탑재 차량</text><text x="16.0" y="54.0" font-size="12.5" font-weight="500" fill="#686A72" text-anchor="start">누적 추정, 2030 (2026년분 8.3만 대 포함)</text><rect x="300.0" y="22.0" width="420.0" height="30.0" rx="4.0" fill="#93BBFF"/><text x="730.0" y="43.0" font-size="14.0" font-weight="700" fill="#131417" text-anchor="start">367만 대</text><text x="16.0" y="90.0" font-size="14.0" font-weight="700" fill="#131417" text-anchor="start">앱마켓을 쓰는 차량 설치</text><text x="16.0" y="108.0" font-size="12.5" font-weight="500" fill="#686A72" text-anchor="start">A 30% · 가정</text><rect x="300.0" y="76.0" width="126.0" height="30.0" rx="4.0" fill="#5E98FF"/><text x="436.0" y="97.0" font-size="14.0" font-weight="700" fill="#131417" text-anchor="start">110만 대</text><text x="16.0" y="144.0" font-size="14.0" font-weight="700" fill="#131417" text-anchor="start">쉼표 설치</text><text x="16.0" y="162.0" font-size="12.5" font-weight="500" fill="#686A72" text-anchor="start">B 10% · 가정</text><rect x="300.0" y="130.0" width="12.6" height="30.0" rx="4.0" fill="#2C7BFF"/><text x="322.6" y="151.0" font-size="14.0" font-weight="700" fill="#131417" text-anchor="start">11.0만 개</text><text x="16.0" y="198.0" font-size="14.0" font-weight="700" fill="#131417" text-anchor="start">월 활성 설치</text><text x="16.0" y="216.0" font-size="12.5" font-weight="500" fill="#686A72" text-anchor="start">C 35% · 미검증 가정</text><rect x="300.0" y="184.0" width="4.4" height="30.0" rx="4.0" fill="#0064FF"/><text x="314.4" y="205.0" font-size="15.0" font-weight="800" fill="#131417" text-anchor="start">3.85만</text><text x="363.2" y="205.0" font-size="12.5" font-weight="500" fill="#686A72" text-anchor="start">  탑재 차량의 1.05%</text><line x1="300.0" y1="12.0" x2="300.0" y2="232.0" stroke="#C7C9CE" stroke-width="1.0" stroke-linecap="butt"/><text x="16.0" y="250.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">막대 길이 = 탑재 차량 대비 비율. 월 활성은 질문·화면·음성을 직접 사용한 차량 설치 단위.</text><text x="16.0" y="267.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">A·B·C는 모두 미검증 가정. 차량 수를 사람 수로 바꾸지 않으며 고객 조사가 먼저다.</text></svg>