 font-weight="800" fill="#131417">죽암휴게소 </tspan><tspan font-weight="600" fill="#686A72">25.2km</tspan></text><text x="92.0" y="170.0" font-size="15.0" font-weight="700" fill="#44464E" text-anchor="middle">지금</text><text x="496.0" y="139.5" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">평소 속도라면 15분 거리</text><polygon points="164.7,141.0 455.5,141.0 792.6,241.0 125.4,241.0" fill="#FFE9E3"/><line x1="164.7" y1="141.0" x2="125.4" y2="241.0" stroke="#F2A08A" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/><line x1="455.5" y1="141.0" x2="792.6" y2="241.0" stroke="#F2A08A" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/><line x1="150.2" y1="151.0" x2="118.7" y2="239.0" stroke="#A4A8AE" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/><text x="654.0" y="213.0" font-size="17.0" font-weight="800" fill="#B4321A" text-anchor="middle">정체 20km = 60분</text><text x="16.0" y="253.5" font-size="15.5" font-weight="800" fill="#44464E" text-anchor="start">시간</text><line x1="92.0" y1="248.0" x2="826.0" y2="248.0" stroke="#C7C9CE" stroke-width="6.0" stroke-linecap="round"/><line x1="125.4" y1="248.0" x2="792.6" y2="248.0" stroke="#FE3D16" stroke-width="10.0" stroke-linecap="butt"/><circle cx="92.0" cy="248.0" r="7.0" fill="#44464E"/><circle cx="118.7" cy="248.0" r="8.0" fill="#0064FF" stroke="#FFFFFF" stroke-width="2.0"/><circle cx="793.7" cy="248.0" r="13.0" fill="#FFFFFF" stroke="#0064FF" stroke-width="2.5"/><path d="M212-80v-300h-50v-228q0-29 21.5-50.5t50.24-21.5h104.52q28.74 0 50.24 21.5Q410-637 410-608v228h-50v300H212Zm74.08-654q-30.08 0-51.58-21.42t-21.5-51.5q0-30.08 21.42-51.58t51.5-21.5q30.08 0 51.58 21.42t21.5 51.5q0 30.08-21.42 51.58t-51.5 21.5ZM630-80v-240H526l86-311q7.22-23.59 26.61-36.3Q658-680 684-680t45.39 12.7Q748.78-654.59 756-631l86 311H738v240H630Zm54.08-654q-30.08 0-51.58-21.42t-21.5-51.5q0-30.08 21.42-51.58t51.5-21.5q30.08 0 51.58 21.42t21.5 51.5q0 30.08-21.42 51.58t-51.5 21.5Z" fill="#0064FF" transform="translate(785.62 239.88) scale(0.01693) translate(0 960)"/><text x="92.0" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">0</text><text x="203.2" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">10분</text><text x="314.4" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">20분</text><text x="425.6" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">30분</text><text x="536.8" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">40분</text><text x="793.7" y="278.0" font-size="15.5" font-weight="800" fill="#131417" text-anchor="middle">죽암 63분</text><text x="92.0" y="302.0" font-size="16.0" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#131417">7살 아이 화장실 게이지 </tspan><tspan font-weight="800" fill="#0050CC">50분</tspan></text><rect x="92.0" y="314.0" width="332.6" height="14.0" rx="4.0" fill="#0064FF"/><rect x="426.6" y="314.0" width="109.2" height="14.0" rx="4.0" fill="#FF8A00"/><rect x="537.8" y="314.0" width="110.2" height="14.0" rx="4.0" fill="#FE3D16"/><line x1="648.1" y1="310.0" x2="648.1" y2="256.0" stroke="#FE3D16" stroke-width="1.6" stroke-linecap="butt" stroke-dasharray="4 3"/><circle cx="648.1" cy="321.0" r="9.0" fill="#FE3D16" stroke="#FFFFFF" stroke-width="2.5"/><text x="648.1" y="360.0" font-size="18.5" font-weight="800" fill="#131417" text-anchor="middle">여기서 ‘쉬 마려워’</text><text x="648.1" y="384.0" font-size="15.5" font-weight="700" fill="#B4321A" text-anchor="middle">남는 선택: 참거나, 갓길에 세우거나</text><rect x="16.0" y="346.0" width="452.0" height="92.0" rx="14.0" fill="#EAF2FF"/><rect x="16.0" y="346.0" width="5.0" height="92.0" rx="2.5" fill="#0064FF"/><text x="36.0" y="371.0" font-size="15.5" font-weight="800" fill="#0050CC" text-anchor="start">쉼표라면 4km 전에 먼저 묻는다</text><text x="36.0" y="395.0" font-size="15.5" font-weight="500" fill="#131417" text-anchor="start">“앞에 1시간 정체가 있어요. 옥산휴게소가 정체 전 마지막</text><text x="36.0" y="416.0" font-size="15.5" font-weight="500" fill="#131417" text-anchor="start">화장실이자 쉼터예요. 들러서 쉬어 갈까요?” → ‘응’ → 경유지</text><text x="16.0" y="462.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">고속도로 2차 사고 치사율은 일반 사고의 약 6배 (한국도로공사)</text></svg>