<svg xmlns="http://www.w3.org/2000/svg" width="850" height="470" viewBox="0 0 850 470" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif"><defs><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0064FF"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#686A72"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44464E"/></marker></defs><rect width="850" height="470" fill="#FFFFFF"/><text x="16.0" y="24.0" font-size="13.5" font-weight="800" fill="#44464E" text-anchor="start">입력</text><line x1="16.0" y1="33.0" x2="184.0" y2="33.0" stroke="#C7C9CE" stroke-width="2.0" stroke-linecap="butt"/><text x="204.0" y="24.0" font-size="13.5" font-weight="800" fill="#44464E" text-anchor="start">상태 추정</text><line x1="204.0" y1="33.0" x2="418.0" y2="33.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><text x="442.0" y="24.0" font-size="13.5" font-weight="800" fill="#44464E" text-anchor="start">판단·계획</text><line x1="442.0" y1="33.0" x2="638.0" y2="33.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><text x="662.0" y="24.0" font-size="13.5" font-weight="800" fill="#44464E" text-anchor="start">전달</text><line x1="662.0" y1="33.0" x2="834.0" y2="33.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><rect x="16.0" y="46.0" width="168.0" height="34.0" rx="8.0" fill="#F7F8FA"/><text x="28.0" y="68.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">탑승자 프로필 · 정차 기록</text><rect x="16.0" y="90.0" width="168.0" height="34.0" rx="8.0" fill="#F7F8FA"/><text x="28.0" y="112.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">조향 · 차속 · 제동</text><rect x="16.0" y="134.0" width="168.0" height="34.0" rx="8.0" fill="#F7F8FA"/><text x="28.0" y="156.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">연속 운전 · 기상 · 수면</text><rect x="16.0" y="178.0" width="168.0" height="34.0" rx="8.0" fill="#F7F8FA"/><text x="28.0" y="200.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">경로 앞 기회 · 정체</text><rect x="16.0" y="222.0" width="168.0" height="34.0" rx="8.0" fill="#F7F8FA"/><text x="28.0" y="244.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">주변 후보 · 경로 시간</text><rect x="16.0" y="266.0" width="168.0" height="34.0" rx="8.0" fill="#F7F8FA"/><text x="28.0" y="288.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">다음 회전 · 대화 이력</text><rect x="16.0" y="310.0" width="168.0" height="34.0" rx="8.0" fill="#F7F8FA"/><text x="28.0" y="332.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">음성 발화 · ‘졸려’</text><rect x="204.0" y="46.0" width="214.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="222.0" cy="66.0" r="11.0" fill="#0064FF"/><text x="222.0" y="70.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="238.0" y="71.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">화장실 필요 모델</text><text x="218.0" y="93.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">와이블 생존모형 (k = 2.5)</text><text x="218.0" y="109.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">개인 기록으로 베이즈 갱신</text><rect x="204.0" y="140.0" width="214.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="222.0" cy="160.0" r="11.0" fill="#0064FF"/><text x="222.0" y="164.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="238.0" y="165.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">운전 스타일 편차</text><text x="218.0" y="187.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">주행 초반 개인 기준선</text><text x="218.0" y="203.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">강건 z점수 + EWMA</text><rect x="204.0" y="234.0" width="214.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="222.0" cy="254.0" r="11.0" fill="#0064FF"/><text x="222.0" y="258.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="238.0" y="259.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">피로 모델</text><text x="218.0" y="281.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">2시간 휴식 리듬 + 졸림 곡선</text><text x="218.0" y="297.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">‘혹시 졸리세요?’ 대답 우선</text><rect x="442.0" y="46.0" width="196.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="460.0" cy="66.0" r="11.0" fill="#0064FF"/><text x="460.0" y="70.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="476.0" y="71.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">마지막 기회</text><text x="456.0" y="93.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">정체 반영 도착 시간 vs</text><text x="456.0" y="109.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">판단 마감(30%) · 커버리지</text><rect x="442.0" y="140.0" width="196.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="460.0" cy="160.0" r="11.0" fill="#0064FF"/><text x="460.0" y="164.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="476.0" y="165.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">급해 순위</text><text x="456.0" y="187.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">총 소요 + 영업·주차</text><text x="456.0" y="203.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">야간 안전·교환대 가점</text><rect x="442.0" y="234.0" width="196.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="460.0" cy="254.0" r="11.0" fill="#0064FF"/><text x="460.0" y="258.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="476.0" y="259.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">피트스톱 플래너</text><text x="456.0" y="281.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">경로 순서 동적 계획법</text><text x="456.0" y="297.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">정차 수·시간 최소화</text><rect x="662.0" y="46.0" width="172.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="680.0" cy="66.0" r="11.0" fill="#0064FF"/><text x="680.0" y="70.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="696.0" y="71.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">묻는 타이밍</text><text x="676.0" y="93.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">회전·대화 뒤 침묵 +</text><text x="676.0" y="109.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">톰프슨 샘플링</text><rect x="662.0" y="140.0" width="172.0" height="82.0" rx="10.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.3"/><circle cx="680.0" cy="160.0" r="11.0" fill="#0064FF"/><text x="680.0" y="164.6" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="696.0" y="165.0" font-size="13.5" font-weight="800" fill="#131417" text-anchor="start">음성 의도</text><text x="676.0" y="187.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">규칙 분류가 기본</text><text x="676.0" y="203.5" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">LLM은 선택</text><rect x="662.0" y="234.0" width="172.0" height="82.0" rx="10.0" fill="#EAF2FF" stroke="#0064FF" stroke-width="1.3"/><text x="676.0" y="258.0" font-size="13.5" font-weight="800" fill="#0050CC" text-anchor="start">출력</text><text x="676.0" y="280.0" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">게이지 2개 · 질문 1개</text><text x="676.0" y="296.5" font-size="12.0" font-weight="600" fill="#44464E" text-anchor="start">추천 · 정차 계획 · 공조</text><line x1="186.0" y1="180.0" x2="202.0" y2="180.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><line x1="311.0" y1="222.0" x2="311.0" y2="232.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><line x1="420.0" y1="87.0" x2="440.0" y2="87.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><line x1="420.0" y1="275.0" x2="440.0" y2="275.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><path d="M 420 100 C 432 100 428 262 440 262" fill="none" stroke="#686A72" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrG)"/><line x1="640.0" y1="87.0" x2="660.0" y2="87.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><line x1="640.0" y1="181.0" x2="660.0" y2="270.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><line x1="640.0" y1="275.0" x2="660.0" y2="275.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><line x1="748.0" y1="130.0" x2="748.0" y2="138.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><line x1="748.0" y1="224.0" x2="748.0" y2="232.0" stroke="#686A72" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrG)"/><rect x="204.0" y="352.0" width="630.0" height="100.0" rx="14.0" fill="#F7F8FA"/><text x="220.0" y="378.0" font-size="13.5" font-weight="800" fill="#44464E" text-anchor="start">기기 안에서 학습 (서버로 보내지 않음)</text><text x="220.0" y="406.0" font-size="12.5" font-weight="500" fill="#131417" text-anchor="start">화장실 정차 간격 → ① 사후분포 갱신 (다른 사람 때문에 선 정차는 중도절단)</text><text x="220.0" y="432.0" font-size="12.5" font-weight="500" fill="#131417" text-anchor="start">질문 수락·거절 → ⑦ 질문 종류 × 묻는 거리별 수락률 갱신</text><path d="M 748 318 L 748 340 L 520 340 L 520 350" fill="none" stroke="#0064FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrA)"/><text x="16.0" y="378.0" font-size="13.5" font-weight="800" fill="#44464E" text-anchor="start">원칙</text><text x="16.0" y="402.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">결정은 규칙·최적화가 하고</text><text x="16.0" y="419.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">근거를 한 줄로 함께 보여 준다.</text><text x="16.0" y="436.0" font-size="12.0" font-weight="500" fill="#686A72" text-anchor="start">졸음 감지·의료 판단은 하지 않는다.</text></svg>