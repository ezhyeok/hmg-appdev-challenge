<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="850" height="416" viewBox="0 0 850 416" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif"><defs><marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0064FF"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#686A72"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44464E"/></marker></defs><rect width="850" height="416" fill="#FFFFFF"/><text x="16.0" y="32.0" font-size="19.0" font-weight="800" fill="#131417" text-anchor="start">화장실 위기: 급해진 뒤 30분 넘게 화장실에 못 간 여정</text><text x="16.0" y="58.0" font-size="15.5" font-weight="500" fill="#686A72" text-anchor="start">운전자 + 7살 아이 · 명절 정체 · 정책마다 같은 여정 5000번 (엔진 코드 시뮬레이션)</text><line x1="176.0" y1="76.0" x2="176.0" y2="256.0" stroke="#E0E1E6" stroke-width="1.0" stroke-linecap="butt"/><text x="176.0" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">0%</text><line x1="237.3" y1="76.0" x2="237.3" y2="256.0" stroke="#E0E1E6" stroke-width="1.0" stroke-linecap="butt"/><text x="237.3" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">10%</text><line x1="298.7" y1="76.0" x2="298.7" y2="256.0" stroke="#E0E1E6" stroke-width="1.0" stroke-linecap="butt"/><text x="298.7" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">20%</text><line x1="360.0" y1="76.0" x2="360.0" y2="256.0" stroke="#E0E1E6" stroke-width="1.0" stroke-linecap="butt"/><text x="360.0" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">30%</text><line x1="421.3" y1="76.0" x2="421.3" y2="256.0" stroke="#E0E1E6" stroke-width="1.0" stroke-linecap="butt"/><text x="421.3" y="276.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">40%</text><text x="164.0" y="102.5" font-size="15.5" font-weight="500" fill="#131417" text-anchor="end">지금처럼</text><rect x="176.0" y="82.0" width="170.5" height="30.0" rx="4.0" fill="#A4A8AE"/><line x1="339.0" y1="97.0" x2="354.2" y2="97.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="339.0" y1="91.0" x2="339.0" y2="103.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="354.2" y1="91.0" x2="354.2" y2="103.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><text x="362.2" y="102.5" font-size="15.5" font-weight="800" fill="#131417" text-anchor="start">28%</text><text x="164.0" y="148.5" font-size="15.5" font-weight="500" fill="#131417" text-anchor="end">2시간마다 휴게소</text><rect x="176.0" y="128.0" width="157.7" height="30.0" rx="4.0" fill="#A4A8AE"/><line x1="326.5" y1="143.0" x2="341.3" y2="143.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="326.5" y1="137.0" x2="326.5" y2="149.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="341.3" y1="137.0" x2="341.3" y2="149.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><text x="349.3" y="148.5" font-size="15.5" font-weight="800" fill="#131417" text-anchor="start">26%</text><text x="164.0" y="194.5" font-size="15.5" font-weight="800" fill="#131417" text-anchor="end">쉼표 (수락 70%)</text><rect x="176.0" y="174.0" width="107.0" height="30.0" rx="4.0" fill="#5E98FF"/><line x1="276.6" y1="189.0" x2="289.6" y2="189.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="276.6" y1="183.0" x2="276.6" y2="195.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="289.6" y1="183.0" x2="289.6" y2="195.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><text x="297.6" y="194.5" font-size="15.5" font-weight="800" fill="#131417" text-anchor="start">17%</text><text x="164.0" y="240.5" font-size="15.5" font-weight="800" fill="#131417" text-anchor="end">쉼표 (수락 100%)</text><rect x="176.0" y="220.0" width="78.8" height="30.0" rx="4.0" fill="#0064FF"/><line x1="249.2" y1="235.0" x2="260.6" y2="235.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="249.2" y1="229.0" x2="249.2" y2="241.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><line x1="260.6" y1="229.0" x2="260.6" y2="241.0" stroke="#131417" stroke-width="1.6" stroke-linecap="butt"/><text x="268.6" y="240.5" font-size="15.5" font-weight="800" fill="#131417" text-anchor="start">13%</text><text x="500.0" y="92.0" font-size="16.0" font-weight="800" fill="#131417" text-anchor="start">다른 탑승 조건 (명절 정체)</text><text x="500.0" y="114.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">쉼표(수락 70%) − 지금처럼, %p</text><line x1="793.0" y1="130.0" x2="793.0" y2="268.0" stroke="#686A72" stroke-width="1.2" stroke-linecap="butt"/><text x="793.0" y="288.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">0</text><text x="727.0" y="288.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="middle">−20</text><text x="500.0" y="151.0" font-size="15.0" font-weight="600" fill="#44464E" text-anchor="start">아이 4세</text><text x="684.0" y="151.0" font-size="15.0" font-weight="700" fill="#131417" text-anchor="end">39→28%</text><line x1="752.2" y1="146.0" x2="761.2" y2="146.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><circle cx="756.7" cy="146.0" r="5.5" fill="#0064FF" stroke="#FFFFFF" stroke-width="1.5"/><text x="500.0" y="187.0" font-size="15.0" font-weight="600" fill="#44464E" text-anchor="start">어르신</text><text x="684.0" y="187.0" font-size="15.0" font-weight="700" fill="#131417" text-anchor="end">28→17%</text><line x1="753.2" y1="182.0" x2="761.5" y2="182.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><circle cx="757.4" cy="182.0" r="5.5" fill="#0064FF" stroke="#FFFFFF" stroke-width="1.5"/><text x="500.0" y="223.0" font-size="15.0" font-weight="600" fill="#44464E" text-anchor="start">과민성 방광</text><text x="684.0" y="223.0" font-size="15.0" font-weight="700" fill="#131417" text-anchor="end">28→14%</text><line x1="742.9" y1="218.0" x2="751.1" y2="218.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><circle cx="747.0" cy="218.0" r="5.5" fill="#0064FF" stroke="#FFFFFF" stroke-width="1.5"/><text x="500.0" y="259.0" font-size="15.0" font-weight="600" fill="#44464E" text-anchor="start">어른 2명</text><text x="684.0" y="259.0" font-size="15.0" font-weight="700" fill="#131417" text-anchor="end">26→15%</text><line x1="753.0" y1="254.0" x2="761.1" y2="254.0" stroke="#0064FF" stroke-width="2.0" stroke-linecap="butt"/><circle cx="757.0" cy="254.0" r="5.5" fill="#0064FF" stroke="#FFFFFF" stroke-width="1.5"/><text x="16.0" y="326.0" font-size="15.5" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#131417">대가 </tspan><tspan font-weight="500" fill="#44464E">권장 습관인 2시간마다 휴게소와 비교하면, 쉼표(수락 70%)는 여정당 정차 0.91회·6분이 늘고 위기는 26%→17%로 준다.</tspan></text><text x="16.0" y="349.0" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">지금처럼보다 늘어나는 30분 중 24분은 지침이 권하는 2시간 휴식 몫이다(지금처럼은 100%의 여정에서 2시간 30분 넘게 쉬지 않았다).</text><text x="16.0" y="382.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">막대는 위기 비율, 선은 95% 구간(윌슨). 정체가 없으면 네 정책 모두 0%. 실제 사용 결과가 아니라 엔진 코드를 그대로 돌린</text><text x="16.0" y="402.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">시뮬레이션이다(경부고속도로 서울→부산, 오전 9시 출발, 정체 1~3개 무작위, 사람마다 실제 간격이 사전값과 다름, 개인 기록 없음).</text></svg>