 font-weight="600" fill="#686A72" text-anchor="start">getTBTInfo · getRouteStateInfo</text><text x="26.0" y="309.0" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">GEAR_SELECTION · 도어·조향</text><rect x="207.6" y="26.4" width="258.0" height="120.0" rx="14.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.5"/><circle cx="233.6" cy="53.4" r="13.0" fill="#0064FF"/><text x="233.6" y="58.0" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="253.6" y="59.4" font-size="18.5" font-weight="800" fill="#131417" text-anchor="start">추정</text><text x="223.6" y="88.4" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">탑승자별 화장실·휴식 권유 시점</text><text x="223.6" y="115.4" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">와이블 생존모형 · 베이즈 갱신</text><text x="223.6" y="134.9" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">Three-Process Model</text><rect x="527.4" y="78.4" width="258.0" height="141.0" rx="14.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.5"/><circle cx="553.4" cy="105.4" r="13.0" fill="#0064FF"/><text x="553.4" y="110.0" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="573.4" y="111.4" font-size="18.5" font-weight="800" fill="#131417" text-anchor="start">판단</text><text x="543.4" y="140.4" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">경로 위 화장실 공백, 마지막 기회,</text><text x="543.4" y="161.4" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">주행 부담을 줄이려 정한 규칙</text><text x="543.4" y="188.4" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">requestTrip (진행 방향)</text><text x="543.4" y="207.9" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">CarUxRestrictions</text><rect x="527.4" y="280.6" width="258.0" height="141.0" rx="14.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.5"/><circle cx="553.4" cy="307.6" r="13.0" fill="#0064FF"/><text x="553.4" y="312.2" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="573.4" y="313.6" font-size="18.5" font-weight="800" fill="#131417" text-anchor="start">묻고 실행</text><text x="543.4" y="342.6" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">음성으로 묻고 수락하면</text><text x="543.4" y="363.6" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">경유지(마이크 종단 미검증)</text><text x="543.4" y="390.6" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">TTS·STT · addWaypoint</text><text x="543.4" y="410.1" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">requestRoute</text><rect x="207.6" y="342.3" width="258.0" height="142.5" rx="14.0" fill="#FFFFFF" stroke="#C7C9CE" stroke-width="1.5"/><circle cx="233.6" cy="369.3" r="13.0" fill="#0064FF"/><text x="233.6" y="373.9" font-size="13.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="253.6" y="375.3" font-size="18.5" font-weight="800" fill="#131417" text-anchor="start">학습</text><text x="223.6" y="404.3" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">정차 기록 → 모델 보정(이용 오인</text><text x="223.6" y="425.3" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">가능), 질문 수락률 → 묻는 거리</text><text x="223.6" y="446.3" font-size="15.5" font-weight="500" fill="#44464E" text-anchor="start">톰프슨 샘플링</text><text x="223.6" y="473.3" font-size="15.0" font-weight="600" fill="#686A72" text-anchor="start">기기 안에만 저장</text><text x="425.0" y="242.0" font-size="21.0" font-weight="800" fill="#131417" text-anchor="middle">모든 판단은 기기 안에서</text><text x="425.0" y="270.0" font-size="15.5" font-weight="500" fill="#686A72" text-anchor="middle">1초마다 감지·추정·판단</text><text x="425.0" y="291.0" font-size="15.5" font-weight="500" fill="#686A72" text-anchor="middle">기록 기반 보정 · 정확도 미검증</text></svg>