.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">① 화면 게이지는 필요 확률 50%, 마지막 기회·계획 판단은 30%에서 정한다(엔진 사전분포). ② 가상의 성인(실제 중앙값 100분)의</text><text x="16.0" y="438.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">화장실 간격 12개(점)를 차례로 넣으면 엔진의 사후 중앙값이 사전값 150분에서 116분으로 실제 쪽으로 옮겨 간다. ③ 그림 1의</text><text x="16.0" y="458.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">장면(운전자와 7살 아이 모두 마지막 화장실 55분 뒤). 누군가 필요해질 확률이 30%에 닿는 13분 뒤가 판단 마감이다. 마감 전 마지막</text><text x="16.0" y="478.0" font-size="15.0" font-weight="500" fill="#686A72" text-anchor="start">기회인 옥산휴게소(21%)를 지나치면 다음 화장실 죽암휴게소(73%)는 마감 뒤라서 4km 전에 묻는다.</text></svg>